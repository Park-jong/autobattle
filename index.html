<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>전술 지휘관 (가제)</title>
    <style>
      html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
      /* 왼쪽 열(캔버스 + 아래 손패) + 디버그 패널(오른쪽). 좁은 창에서는 위아래로 쌓는다 */
      #app { display: flex; height: 100%; }
      #stage { flex: 1 1 auto; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
      #game { position: relative; flex: 1 1 auto; min-width: 0; min-height: 0; }
      #hand { flex: 0 0 auto; }
      #panel { flex: 0 0 340px; width: 340px; overflow-y: auto; border-left: 1px solid #2a2f3d; }
      @media (max-width: 800px) {
        #app { flex-direction: column; }
        #stage { flex: 1 1 58%; }
        #panel { flex: 0 0 42%; width: auto; border-left: 0; border-top: 1px solid #2a2f3d; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="stage">
        <div id="game"></div>
        <section id="hand" hidden></section>
      </div>
      <aside id="panel"></aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
